[project]
name = "acme-pay"
version = "0.1.0"
description = "ACME Pay API: salary management and pay insights for HR."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acme_pay"]

# --- Vercel: serve the FastAPI app as a Python Function ---------------------
# Resolved as a file path from this directory: acme_pay/main.py
[tool.vercel]
entrypoint = "acme_pay.main:app"

# --- Ruff: linting + formatting -------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear: likely bugs
    "UP",       # pyupgrade: modern syntax
    "SIM",      # simplifications
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "S",        # bandit: security
    "DTZ",      # timezone-aware datetimes
    "PT",       # pytest style
    "D",        # docstrings
]
ignore = [
    "D105",     # magic methods are self-explanatory
    "D107",     # __init__ documented on the class
]

[tool.ruff.lint.isort]
known-first-party = ["acme_pay"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]   # asserts are the point; test names are the docs
"migrations/**" = ["D"]

# --- mypy: strict typing --------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
packages = ["acme_pay"]

# --- pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = ["integration: needs a running PostgreSQL (skip with -m 'not integration')"]

[tool.coverage.run]
source = ["acme_pay"]
branch = true
# SQLAlchemy's async layer runs code in greenlets; trace them too.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
